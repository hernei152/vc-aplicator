{% extends "aplicator/base.html" %}
{% block title %}{{ title }} — accel{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="actions">
    <button type="submit">Guardar</button>
    <a href="{% url 'aplicator:context' %}" role="button" class="secondary outline">Cancelar</a>
  </div>
</form>
{% endblock %}
