<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>accel</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    nav {
      display: flex;
      gap: 1rem;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #8888;
    }
    nav a { text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    h1 { margin-top: 0; }
    h2 { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; vertical-align: top; }
    fieldset {
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid #8884;
      border-radius: 6px;
    }
    legend { font-weight: 600; padding: 0 0.5rem; }
    textarea, input[type="text"], input[type="url"] {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem;
    }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    button {
      margin-top: 0.75rem;
      margin-right: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    ul, ol { padding-left: 1.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'aplicator:context' %}">Contexto</a>
    <a href="{% url 'aplicator:accelerator_add' %}">Aceleradoras</a>
    <a href="{% url 'aplicator:plan' %}">Plan</a>
    <a href="{% url 'aplicator:answer_bank' %}">Answer bank</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
